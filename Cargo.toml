[package]
name = "transcriptor"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
cpal = "0.17.3"
eframe = "0.33.3"
egui = "0.33.3"
futures-util = "0.3.32"
ndarray = "0.16"
num-traits = "0.2.19"
ort = { version = "2.0.0-rc.12", default-features = true }
rubato = "1.0.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"] }
rfd = "0.17.*"
rustfft = "6.2"
tokio = { version = "1.50.0", features = ["full"] }
whisper-rs = { version = "0.16.0" }

[features]
# ── Aceleración por GPU ────────────────────────────────────────────────────
# NVIDIA — Linux y Windows (Whisper + Diarización)
cuda      = ["whisper-rs/cuda", "ort/cuda"]

# AMD — Linux (ROCm/HIP). Diarización usa CPU (ort no soporta ROCm).
rocm      = ["whisper-rs/hipblas"]

# Intel — Linux (oneAPI SYCL). Diarización usa CPU.
intel     = ["whisper-rs/intel-sycl"]

# Apple Silicon — macOS (Metal + Neural Engine via CoreML)
metal     = ["whisper-rs/metal", "whisper-rs/coreml", "ort/coreml"]

# Windows AMD + Intel — DirectML (Whisper via CMAKE_ARGS, Diarización via ort)
directml  = ["ort/directml"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.185"