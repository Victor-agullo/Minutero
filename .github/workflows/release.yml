name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# ════════════════════════════════════════════════════════════════════════════
#  MATRIX DE BUILDS
#
#  Linux:
#    · linux-x86_64-cuda      — NVIDIA  (CUDA 12.x)
#    · linux-x86_64-rocm      — AMD     (ROCm 6.x)
#    · linux-x86_64-intel     — Intel   (oneAPI SYCL)
#    · linux-x86_64-cpu       — fallback sin GPU
#
#  Windows:
#    · windows-x86_64-cuda    — NVIDIA  (CUDA 12.x, DLLs incluidas)
#    · windows-x86_64-directml— AMD + Intel (DirectML, Windows 10/11)
#    · windows-x86_64-cpu     — fallback sin GPU
#
#  macOS:
#    · macos-intel-cpu                — Intel (x86_64)
#    · macos-apple-silicon-metal      — Apple Silicon M1/M2/M3/M4 (Metal + CoreML)
# ════════════════════════════════════════════════════════════════════════════

jobs:
  # ── Linux: todos los backends ────────────────────────────────────────────
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            artifact: transcriptor-linux-x86_64-cuda
            features: cuda

          - backend: rocm
            artifact: transcriptor-linux-x86_64-rocm
            features: rocm

          - backend: intel
            artifact: transcriptor-linux-x86_64-intel
            features: intel

          - backend: cpu
            artifact: transcriptor-linux-x86_64-cpu
            features: ""

    runs-on: ubuntu-22.04
    name: "Linux — ${{ matrix.artifact }}"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Dependencias base
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev libasound2-dev \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev ffmpeg cmake

      # ── CUDA ────────────────────────────────────────────────────────────
      - name: CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.4.0'

      # ── ROCm ────────────────────────────────────────────────────────────
      - name: "🔍 Debug — ROCm preinstalled packages"
        if: matrix.backend == 'rocm'
        run: |
          echo "=== dpkg: all rocm/hip/hsa/comgr packages ==="
          dpkg -l '*rocm*' '*hip*' '*hsa*' '*comgr*' '*rocprofiler*' '*rocminfo*' 2>/dev/null || true
          echo "=== apt-mark: held packages ==="
          apt-mark showhold 2>/dev/null || true
          echo "=== /opt/rocm exists? ==="
          ls /opt/rocm 2>/dev/null || echo "(not present)"
          echo "=== Ubuntu release ==="
          lsb_release -a 2>/dev/null || cat /etc/os-release

      - name: ROCm SDK
        if: matrix.backend == 'rocm'
        run: |
          # Eliminar con dpkg --force para evitar conflictos de versión en Ubuntu 22.04
          sudo dpkg --remove --force-depends --force-remove-reinstreq \
            rocminfo rocm-cmake rocm-device-libs rocm-utils \
            rocprofiler rocprofiler-dev rocprofiler-plugins \
            2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true

          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] \
            https://repo.radeon.com/rocm/apt/6.1 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list

          # Dar prioridad al repo de AMD sobre paquetes del sistema
          printf 'Package: rocminfo rocm-* hip* hsa-* comgr*\nPin: origin repo.radeon.com\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/rocm.pref

          sudo apt-get update
          sudo apt-get install -y rocm-dev hipblas-dev
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "ROCM_PATH=/opt/rocm"   >> $GITHUB_ENV
          echo "HIP_PATH=/opt/rocm"    >> $GITHUB_ENV

      # ── Intel oneAPI SYCL ───────────────────────────────────────────────
      - name: "🔍 Debug — Intel oneAPI environment"
        if: matrix.backend == 'intel'
        run: |
          echo "=== GPU devices ==="
          lspci 2>/dev/null | grep -iE "VGA|3D|Display|Video" || true
          echo "=== oneAPI already installed? ==="
          ls /opt/intel/oneapi 2>/dev/null || echo "(not present)"
          echo "=== Ubuntu release ==="
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "=== cmake version ==="
          cmake --version 2>/dev/null || echo "cmake not found"

      - name: Intel oneAPI Base Toolkit
        if: matrix.backend == 'intel'
        run: |
          wget -qO - https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] \
            https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

          # Detectar versión instalada y exportar rutas
          MKL_VER=$(ls /opt/intel/oneapi/mkl/ | grep -v latest | sort -V | tail -1)
          CMPLR_VER=$(ls /opt/intel/oneapi/compiler/ | grep -v latest | sort -V | tail -1)
          MKL_ROOT="/opt/intel/oneapi/mkl/$MKL_VER"
          CMPLR_ROOT="/opt/intel/oneapi/compiler/$CMPLR_VER"

          echo "CMPLR_ROOT=$CMPLR_ROOT"                   >> $GITHUB_ENV
          echo "MKLROOT=$MKL_ROOT"                        >> $GITHUB_ENV
          echo "$CMPLR_ROOT/bin"                          >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$MKL_ROOT/lib/intel64:$CMPLR_ROOT/linux/compiler/lib/intel64_lin" >> $GITHUB_ENV

          # whisper-rs-sys pasa CMAKE_ARGS a la build de whisper.cpp
          # MKL_DIR le indica a cmake dónde está MKLConfig.cmake
          echo "CMAKE_ARGS=-DMKL_DIR=$MKL_ROOT/lib/cmake/mkl -DCMAKE_PREFIX_PATH=$MKL_ROOT" >> $GITHUB_ENV

      - name: "🔍 Debug — Intel oneAPI post-install layout"
        if: matrix.backend == 'intel'
        run: |
          echo "=== MKLConfig.cmake locations ==="
          find /opt/intel/oneapi -name "MKLConfig.cmake" 2>/dev/null || echo "(not found)"
          echo "=== MKL versions ==="
          ls /opt/intel/oneapi/mkl/ 2>/dev/null || echo "(mkl not installed)"
          echo "=== Compiler versions ==="
          ls /opt/intel/oneapi/compiler/ 2>/dev/null || echo "(compiler not installed)"
          echo "=== CMAKE_ARGS env ==="
          echo "${CMAKE_ARGS:-<not set>}"
          echo "=== icpx available? ==="
          which icpx 2>/dev/null || echo "(icpx not in PATH)"
          echo "=== SYCL headers present? ==="
          find /opt/intel/oneapi -name "sycl.hpp" 2>/dev/null | head -3 || echo "(not found)"

      - name: Caché Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.backend }}-${{ hashFiles('**/Cargo.lock') }}

      - name: "🔍 Debug — whisper-rs-sys build.rs & cargo env"
        run: |
          echo "=== whisper-rs-sys build.rs ==="
          find ~/.cargo/registry/src -path "*/whisper-rs-sys-*/build.rs" 2>/dev/null \
            | head -1 | xargs cat 2>/dev/null || echo "(run cargo fetch first or not cached yet)"
          echo "=== Cargo.toml features active ==="
          cargo metadata --no-deps --format-version 1 2>/dev/null \
            | python3 -c "import json,sys; m=json.load(sys.stdin); [print(p['name'], p.get('features',{})) for p in m['packages'] if 'whisper' in p['name']]" || true
          echo "=== LIBCLANG_PATH content ==="
          ls /usr/lib/llvm-14/lib 2>/dev/null | grep clang | head -5 || echo "(llvm-14 not found)"
          echo "=== Available llvm versions ==="
          ls /usr/lib/ | grep llvm || true
        env:
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

      - name: Compilar
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target x86_64-unknown-linux-gnu --features "$FEATURES"
          else
            cargo build --release --target x86_64-unknown-linux-gnu
          fi
        env:
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

      - name: Empaquetar
        run: |
          cp target/x86_64-unknown-linux-gnu/release/transcriptor .
          tar -czf ${{ matrix.artifact }}.tar.gz transcriptor

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz


  # ── Windows: todos los backends ──────────────────────────────────────────
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            artifact: transcriptor-windows-x86_64-cuda
            features: cuda

          - backend: directml
            artifact: transcriptor-windows-x86_64-directml
            features: ""

          - backend: cpu
            artifact: transcriptor-windows-x86_64-cpu
            features: ""

    runs-on: windows-latest
    name: "Windows — ${{ matrix.artifact }}"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: LLVM
        run: choco install llvm -y

      - name: CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.4.0'

      # DirectML está incluido en el Windows SDK — solo activar el flag cmake.
      # whisper-rs-sys respeta la variable CMAKE_ARGS y la pasa a la build de whisper.cpp.
      - name: Configurar DirectML
        if: matrix.backend == 'directml'
        shell: pwsh
        run: |
          echo "CMAKE_ARGS=-DGGML_DIRECTML=ON" >> $env:GITHUB_ENV

      - name: Caché Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ matrix.backend }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Compilar
        shell: pwsh
        run: |
          $features = "${{ matrix.features }}"
          if ($features) {
            cargo build --release --target x86_64-pc-windows-msvc --features $features
          } else {
            cargo build --release --target x86_64-pc-windows-msvc
          }
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

      # Empaquetar — CUDA: incluir DLLs runtime para que funcione sin CUDA instalado
      - name: Empaquetar (CUDA)
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          $srcDir  = "target\x86_64-pc-windows-msvc\release"
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"
          $dlls = @(
            "cublas64_12.dll", "cublasLt64_12.dll",
            "cudart64_120.dll", "cufft64_11.dll", "curand64_10.dll"
          )
          foreach ($dll in $dlls) {
            $src = "$cudaBin\$dll"
            if (Test-Path $src) { Copy-Item $src $srcDir; Write-Host "DLL incluida: $dll" }
          }
          $files = @("$srcDir\transcriptor.exe") + (Get-ChildItem "$srcDir\*.dll" | % { $_.FullName })
          Compress-Archive -Path $files -DestinationPath "${{ matrix.artifact }}.zip"

      # DirectML.dll viene en Windows 10/11, pero la incluimos por portabilidad
      - name: Empaquetar (DirectML)
        if: matrix.backend == 'directml'
        shell: pwsh
        run: |
          $srcDir = "target\x86_64-pc-windows-msvc\release"
          # Buscar DirectML.dll en el Windows SDK
          $dmlDll = Get-ChildItem "C:\Windows\System32\DirectML.dll" -ErrorAction SilentlyContinue
          if (-not $dmlDll) {
            $dmlDll = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\DirectML.dll" `
              -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if ($dmlDll) {
            Copy-Item $dmlDll.FullName $srcDir
            Write-Host "DirectML.dll incluida desde: $($dmlDll.FullName)"
          } else {
            Write-Warning "DirectML.dll no encontrada en SDK. Windows 10/11 la tiene nativa."
          }
          $files = @("$srcDir\transcriptor.exe") + (Get-ChildItem "$srcDir\*.dll" | % { $_.FullName })
          Compress-Archive -Path $files -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Empaquetar (CPU)
        if: matrix.backend == 'cpu'
        shell: pwsh
        run: |
          $srcDir = "target\x86_64-pc-windows-msvc\release"
          Compress-Archive -Path "$srcDir\transcriptor.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip


  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: transcriptor-macos-intel-cpu
            features: ""

          # Metal (GPU) + CoreML (Neural Engine) para Apple Silicon
          - target: aarch64-apple-darwin
            artifact: transcriptor-macos-apple-silicon-metal
            features: metal

    runs-on: macos-latest
    name: "macOS — ${{ matrix.artifact }}"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dependencias macOS
        run: brew install ffmpeg llvm

      - name: Caché Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Compilar
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        env:
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib

      - name: Empaquetar
        run: |
          cp target/${{ matrix.target }}/release/transcriptor .
          tar -czf ${{ matrix.artifact }}.tar.gz transcriptor

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz


  # ── Crear GitHub Releases ────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determinar nombre de release
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=dev-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Incluir instaladores
        run: |
          cp install.ps1 artifacts/
          cp install.sh  artifacts/
          chmod +x artifacts/install.sh

      - name: Release Linux
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}-linux
          name: "${{ steps.tag.outputs.name }} — Linux"
          body: |
            ## 🐧 Linux — Todas las variantes

            Instalación automática (detecta tu GPU):
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```

            | Archivo | GPU | Requisitos |
            |---|---|---|
            | `transcriptor-linux-x86_64-cuda.tar.gz` | NVIDIA | CUDA Runtime 12.x |
            | `transcriptor-linux-x86_64-rocm.tar.gz` | AMD Radeon | ROCm 6.x |
            | `transcriptor-linux-x86_64-intel.tar.gz` | Intel Arc/Xe | Intel oneAPI Base Toolkit |
            | `transcriptor-linux-x86_64-cpu.tar.gz` | Cualquiera | Solo `ffmpeg` + `pulseaudio-utils` |

            ### Dependencias comunes
            ```bash
            sudo apt install ffmpeg pulseaudio-utils   # Debian/Ubuntu
            sudo dnf install ffmpeg pulseaudio-utils   # Fedora
            ```
          files: |
            artifacts/transcriptor-linux-x86_64-cuda.tar.gz
            artifacts/transcriptor-linux-x86_64-rocm.tar.gz
            artifacts/transcriptor-linux-x86_64-intel.tar.gz
            artifacts/transcriptor-linux-x86_64-cpu.tar.gz
            artifacts/install.sh
          generate_release_notes: false

      - name: Release Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}-windows
          name: "${{ steps.tag.outputs.name }} — Windows"
          body: |
            ## 🪟 Windows — Todas las variantes

            Instalación automática (detecta tu GPU):
            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```

            | Archivo | GPU | Notas |
            |---|---|---|
            | `transcriptor-windows-x86_64-cuda.zip` | NVIDIA | DLLs de CUDA incluidas |
            | `transcriptor-windows-x86_64-directml.zip` | AMD / Intel | DirectML nativo en Windows 10/11 |
            | `transcriptor-windows-x86_64-cpu.zip` | Cualquiera | Sin dependencias de GPU |

            ### Dependencias comunes
            - **ffmpeg**: `winget install Gyan.FFmpeg`
          files: |
            artifacts/transcriptor-windows-x86_64-cuda.zip
            artifacts/transcriptor-windows-x86_64-directml.zip
            artifacts/transcriptor-windows-x86_64-cpu.zip
            artifacts/install.ps1
          generate_release_notes: false

      - name: Release macOS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}-macos
          name: "${{ steps.tag.outputs.name }} — macOS"
          body: |
            ## 🍎 macOS — Intel y Apple Silicon

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```

            | Archivo | Chip | Backend |
            |---|---|---|
            | `transcriptor-macos-intel-cpu.tar.gz` | Intel (x86_64) | CPU |
            | `transcriptor-macos-apple-silicon-metal.tar.gz` | M1/M2/M3/M4 | Metal GPU + CoreML Neural Engine |

            ### Dependencias
            - **ffmpeg**: `brew install ffmpeg`
            - **Audio del sistema**: [BlackHole](https://github.com/ExistentialAudio/BlackHole)
          files: |
            artifacts/transcriptor-macos-intel-cpu.tar.gz
            artifacts/transcriptor-macos-apple-silicon-metal.tar.gz
            artifacts/install.sh
          generate_release_notes: false